name: CI (test gate)

# Runs the unit suite on every push/PR touching backend/ai/database code, using
# the repo's existing stub/mock modes (LLM_MODE=mock, YOLO_MODE=stub, sqlite) so
# it needs no secrets and no GPU. deploy-backend.yml depends on this passing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest testing/ -v
