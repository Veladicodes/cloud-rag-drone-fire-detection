name: build & push backend image to ACR

# The student Azure subscription blocks ACR Tasks (`az acr build`), so the image
# is built on a GitHub runner and pushed to the Azure Container Registry.
# After it pushes, roll it onto the Container App with either:
#   terraform apply -var backend_image=<acr>.azurecr.io/cdfd-backend:<sha>
#   az containerapp update -g cdfdzupn5-rg -n cdfdzupn5-backend --image <...>

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ai/**"
      - "database/**"
      - "cloud/storage*.py"
      - "requirements.txt"
      - ".github/workflows/deploy-backend.yml"

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/cdfd-backend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/cdfd-backend:latest

      - name: Summary
        run: |
          echo "Pushed ${{ secrets.ACR_LOGIN_SERVER }}/cdfd-backend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Roll it out: az containerapp update -g cdfdzupn5-rg -n cdfdzupn5-backend --image ${{ secrets.ACR_LOGIN_SERVER }}/cdfd-backend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
